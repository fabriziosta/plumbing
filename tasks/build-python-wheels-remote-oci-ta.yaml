apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: python, wheels, fromager, konflux
  labels:
    app.kubernetes.io/version: "0.1"
  name: build-python-wheels-remote-oci-ta
spec:
  description: |-
    Remote (multi-platform-controller) variant of build-python-wheels. Requires PLATFORM and a multi-platform-ssh-$(context.taskRun.name) secret provisioned by MPC. Build Python wheels using Fromager and push them as an OCI artifact.
    This task uses Fromager to build Python wheels from source distributions, resolving dependencies automatically. The built wheels are packaged as an OCI artifact and pushed to a registry.
  params:
  - description: List of packages to be built. Each is expected to be pinned to a
      version, e.g. ["urllib3==2.5.0", "numpy==2.3.1"]
    name: PACKAGES
    type: array
  - description: Reference of the OCI artifact to be produced.
    name: IMAGE
    type: string
  - default: ""
    description: Delete image tag after specified time. Empty means to keep the image
      tag. Time values could be something like 1h, 2d, 3w for hours, days, and weeks,
      respectively.
    name: IMAGE_EXPIRES_AFTER
    type: string
  - description: The Trusted Artifact URI pointing to the artifact with the application
      source code.
    name: SOURCE_ARTIFACT
    type: string
  - default: ca-bundle.crt
    description: The name of the key in the ConfigMap that contains the CA bundle
      data.
    name: caTrustConfigMapKey
    type: string
  - default: trusted-ca
    description: The name of the ConfigMap to read CA bundle data from.
    name: caTrustConfigMapName
    type: string
  - default: ""
    description: Optional wheel server URL for prebuilt wheel lookup
    name: WHEEL_SERVER_URL
    type: string
  - default: builder-service-account
    description: 'Name of the K8s secret containing wheel cache server credentials
      (keys: username, password)'
    name: SERVICE_ACCOUNT_SECRET_NAME
    type: string
  - default: /var/workdir/source/overrides/settings
    description: Optional directory of per-package fromager settings (e.g. build_dir
      for monorepo packages)
    name: PACKAGE_SETTINGS_DIR
    type: string
  - default: []
    description: Paths to constraint files relative to source root (e.g. ["overrides/constraints/torch.txt"]).
      Passed as -c flags to build-wheels. Empty list disables constraints.
    name: CONSTRAINT_FILES
    type: array
  - default: ""
    description: Path to a denylist file relative to source root listing package names
      (one per line) to exclude from the OCI artifact. Denied packages are still built
      as transitive dependencies but are not collected or released. Empty string disables
      filtering.
    name: DENIED_PACKAGES_FILE
    type: string
  - description: The platform to build on (e.g. linux/x86_64, linux/arm64)
    name: PLATFORM
    type: string
  - default: "false"
    description: Whether to append a sanitized platform architecture on the IMAGE
      tag
    name: IMAGE_APPEND_PLATFORM
    type: string
  results:
  - description: Digest of the OCI-Artifact just built
    name: IMAGE_DIGEST
  - description: OCI-Artifact repository and tag where the built OCI-Artifact was
      pushed
    name: IMAGE_URL
  - description: OCI-Artifact reference of the built OCI-Artifact
    name: IMAGE_REF
  stepTemplate:
    computeResources:
      limits:
        cpu: "4"
        memory: 4Gi
      requests:
        cpu: "4"
        memory: 4Gi
    env:
    - name: BUILDER_IMAGE
      value: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:8f85ac614755e61319c90a9172e8672e9da36f672178cdc54927920fb4d65aa8
    - name: PLATFORM
      value: $(params.PLATFORM)
    - name: IMAGE_APPEND_PLATFORM
      value: $(params.IMAGE_APPEND_PLATFORM)
    volumeMounts:
    - mountPath: /var/workdir
      name: workdir
  steps:
  - args:
    - use
    - $(params.SOURCE_ARTIFACT)=/var/workdir/source
    computeResources: {}
    image: quay.io/konflux-ci/build-trusted-artifacts:latest@sha256:2712c8a6453fc9db5fc4c2d9d952554a4eea46d2fdba47a272b79fa07f8c8c40
    name: use-trusted-artifact
    volumeMounts:
    - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
      name: trusted-ca
      readOnly: true
      subPath: ca-bundle.crt
  - args:
    - $(params.CONSTRAINT_FILES[*])
    - --
    - $(params.PACKAGES[*])
    computeResources: {}
    env:
    - name: SERVICE_ACCOUNT_USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: $(params.SERVICE_ACCOUNT_SECRET_NAME)
    - name: SERVICE_ACCOUNT_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: $(params.SERVICE_ACCOUNT_SECRET_NAME)
    image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:8f85ac614755e61319c90a9172e8672e9da36f672178cdc54927920fb4d65aa8
    name: build-wheels
    script: |-
      #!/bin/bash
      set -e
      set -o verbose

      echo "[$(date --utc -Ins)] Prepare connection"

      mkdir -p ~/.ssh
      if [ -e "/ssh/error" ]; then
        #no server could be provisioned
        cat /ssh/error
        exit 1
      fi

      SSH_HOST=$(cat /ssh/host)
      export SSH_HOST

      if [ "$SSH_HOST" == "localhost" ] ; then
        IS_LOCALHOST=true
        echo "Localhost detected; running build in cluster"
      elif [ -e "/ssh/otp" ]; then
        if ! curl --fail --cacert /ssh/otp-ca -XPOST -d @/ssh/otp "$(cat /ssh/otp-server)" >~/.ssh/id_rsa; then
          echo "Failed to retrieve SSH key from the OTP server. This can happen when the PipelineRun retry option re-runs a task whose one-time credential was already consumed. Please, start a new build, and if problem persists, please report it as an MPC bug." >&2
          exit 1
        fi
        echo "" >> ~/.ssh/id_rsa
      else
        cp /ssh/id_rsa ~/.ssh
      fi

      mkdir -p scripts

      if ! [[ $IS_LOCALHOST ]]; then
        echo "[$(date --utc -Ins)] Setup VM"

        # plumbing-builder has build-wheels but not ssh/rsync. Install only for real
        # remote VMs. MPC often sets host=localhost for linux/x86_64 (in-cluster),
        # which skips this block and runs build-wheels directly in this image.
        if ! command -v ssh >/dev/null 2>&1 || ! command -v rsync >/dev/null 2>&1; then
          dnf install -y openssh-clients rsync
        fi

        chmod 0400 ~/.ssh/id_rsa

        # Share a single ssh connection to the build VM between every ssh and rsync
        # invocation below. ControlMaster only multiplexes if a ControlPath is set,
        # and ControlPersist keeps the master alive between invocations.
        # Note: OpenSSH rejects inline "#" comments on config value lines.
        cat >~/.ssh/config <<'SSHCONFIGEOF'
      Host *
        ControlMaster auto
        ControlPath ~/.ssh/control-%C
        ControlPersist yes
      SSHCONFIGEOF
        chmod 0600 ~/.ssh/config

        BUILD_DIR=$(cat /ssh/user-dir)
        export BUILD_DIR
        export SSH_ARGS="-o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10"
        echo "$BUILD_DIR"
        # shellcheck disable=SC2086
        ssh $SSH_ARGS "$SSH_HOST"  mkdir -p "${BUILD_DIR@Q}/workspaces" "${BUILD_DIR@Q}/scripts" "${BUILD_DIR@Q}/volumes"

        echo "[$(date --utc -Ins)] Rsync data"

        rsync --timeout=300 -razW /var/workdir/ "$SSH_HOST:$BUILD_DIR/volumes/workdir/"
        rsync --timeout=300 -razW /mnt/trusted-ca/ "$SSH_HOST:$BUILD_DIR/volumes/trusted-ca/"
        mkdir -p "$HOME/.docker"
        rsync --timeout=300 -razW  "$HOME/.docker/" "$SSH_HOST:$BUILD_DIR/.docker/"
        rsync --timeout=300 -razW  "/tekton/results/" "$SSH_HOST:$BUILD_DIR/results/"
      fi
      if [ "${IMAGE_APPEND_PLATFORM}" == "true" ] && [ -n "${IMAGE:-}" ]; then
        IMAGE="${IMAGE}-${PLATFORM//[^a-zA-Z0-9]/-}"
        export IMAGE
      fi

      cat >scripts/script-build-wheels.sh <<'REMOTESSHEOF'
      #!/bin/bash
      set -euo pipefail
      cd /var/workdir
      CONSTRAINT_ARGS=()
      PACKAGE_ARGS=()
      in_packages=false
      for arg in "$@"; do
        if [ "$arg" = "--" ]; then
          in_packages=true
          continue
        fi
        if [[ "$in_packages" == "true" ]]; then
          PACKAGE_ARGS+=("$arg")
        else
          [ -n "$arg" ] && CONSTRAINT_ARGS+=(-c "/var/workdir/source/$arg")
        fi
      done
      exec build-wheels \
        "${CONSTRAINT_ARGS[@]}" \
        --cache-wheel-server-url "$(params.WHEEL_SERVER_URL)" \
        --package-settings-dir "$(params.PACKAGE_SETTINGS_DIR)" \
        "${PACKAGE_ARGS[@]}"

      REMOTESSHEOF
      chmod +x scripts/script-build-wheels.sh

      if ! [[ $IS_LOCALHOST ]]; then
        rsync --timeout=300 -ra scripts "$SSH_HOST:$BUILD_DIR"
        echo "[$(date --utc -Ins)] Build via ssh"
        # shellcheck disable=SC2086
        # Please note: all variables below the first ssh line must be quoted with ${var@Q}!
        # See https://stackoverflow.com/questions/6592376/prevent-ssh-from-breaking-up-shell-script-parameters
        ssh $SSH_ARGS "$SSH_HOST" podman  run \
          --tmpfs /run/secrets \
          -e SERVICE_ACCOUNT_USERNAME="${SERVICE_ACCOUNT_USERNAME@Q}" \
          -e SERVICE_ACCOUNT_PASSWORD="${SERVICE_ACCOUNT_PASSWORD@Q}" \
          -v "${BUILD_DIR@Q}/volumes/workdir:/var/workdir:Z" \
          -v "${BUILD_DIR@Q}/volumes/trusted-ca:/mnt/trusted-ca:Z" \
          -v "${BUILD_DIR@Q}/.docker/:/root/.docker:Z" \
          -v "${BUILD_DIR@Q}/results/:/tekton/results:Z" \
          -v "${BUILD_DIR@Q}/scripts:/scripts:Z" \
          --user=0 --rm --entrypoint='' "${BUILDER_IMAGE@Q}" /scripts/script-build-wheels.sh "${@@Q}"
        echo "[$(date --utc -Ins)] Rsync back"
        rsync --timeout=300 -razW --stats "$SSH_HOST:$BUILD_DIR/volumes/workdir/" /var/workdir/
        rsync --timeout=300 -razW --stats "$SSH_HOST:$BUILD_DIR/results/" "/tekton/results/"
      else
        bash scripts/script-build-wheels.sh "$@"
      fi
      echo "Build on remote host $SSH_HOST finished"

      echo "[$(date --utc -Ins)] End remote"
    volumeMounts:
    - mountPath: /mnt/trusted-ca
      name: trusted-ca
      readOnly: true
    - mountPath: /ssh
      name: ssh
      readOnly: true
    workingDir: /var/workdir
  - computeResources: {}
    image: quay.io/redhat-user-workloads/calunga-tenant/plumbing-builder@sha256:8f85ac614755e61319c90a9172e8672e9da36f672178cdc54927920fb4d65aa8
    name: collect-build-files
    script: |
      #!/bin/bash
      set -euo pipefail
      if [ "${IMAGE_APPEND_PLATFORM}" == "true" ] && [ -n "${IMAGE:-}" ]; then
        IMAGE="${IMAGE}-${PLATFORM//[^a-zA-Z0-9]/-}"
        export IMAGE
      fi
      DENYLIST_ARGS=()
      DENYLIST_FILE="$(params.DENIED_PACKAGES_FILE)"
      if [[ -n "$DENYLIST_FILE" ]]; then
          DENYLIST_PATH="/var/workdir/source/${DENYLIST_FILE}"
          if [[ ! -r "$DENYLIST_PATH" ]]; then
              echo "Denylist file is missing or unreadable: $DENYLIST_PATH" >&2
              exit 1
          fi
          DENYLIST_ARGS=(--denylist "$DENYLIST_PATH")
      fi
      exec collect-build-files "${DENYLIST_ARGS[@]}" /var/workdir/output /var/workdir/artifact
  - computeResources:
      limits:
        memory: 1Gi
      requests:
        cpu: "1"
        memory: 1Gi
    env:
    - name: IMAGE
      value: $(params.IMAGE)
    - name: IMAGE_EXPIRES_AFTER
      value: $(params.IMAGE_EXPIRES_AFTER)
    image: quay.io/konflux-ci/oras:latest@sha256:1beeecce012c99794568f74265c065839f9703d28306a8430b667f639343a98b
    name: create-oci-artifact
    script: |
      #!/bin/bash
      set -euo pipefail
      if [ "${IMAGE_APPEND_PLATFORM}" == "true" ] && [ -n "${IMAGE:-}" ]; then
        IMAGE="${IMAGE}-${PLATFORM//[^a-zA-Z0-9]/-}"
        export IMAGE
      fi

      echo "[$(date --utc -Ins)] Pushing OCI artifact"

      select-oci-auth "$IMAGE" > auth.json
      AUTHFILE="$(realpath auth.json)"

      EXPIRE_LABEL=()
      [ -n "$IMAGE_EXPIRES_AFTER" ] && EXPIRE_LABEL=("--annotation" "quay.expires-after=$IMAGE_EXPIRES_AFTER")

      # Change into artifact directory for proper manifest structure
      cd artifact

      echo "Pushing OCI artifact to ${IMAGE}"
      if ! retry oras push "$IMAGE" \
        --registry-config "${AUTHFILE}" \
        "${EXPIRE_LABEL[@]}" \
        --artifact-type "application/vnd.python.wheels" \
        *
      then
        echo "Failed to push OCI artifact ${IMAGE} to registry"
        exit 1
      fi

      if ! RESULTING_DIGEST=$(retry oras resolve \
        --registry-config "${AUTHFILE}" "${IMAGE}")
      then
        echo "Failed to get digest for ${IMAGE} from registry"
        exit 1
      fi

      echo -n "$IMAGE" | tee "$(results.IMAGE_URL.path)"
      echo -n "$RESULTING_DIGEST" | tee "$(results.IMAGE_DIGEST.path)"
      echo -n "${IMAGE}@${RESULTING_DIGEST}" | tee "$(results.IMAGE_REF.path)"

      echo "[$(date --utc -Ins)] End create-oci-artifact"
    volumeMounts:
    - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
      name: trusted-ca
      readOnly: true
      subPath: ca-bundle.crt
    workingDir: /var/workdir
  volumes:
  - configMap:
      items:
      - key: $(params.caTrustConfigMapKey)
        path: ca-bundle.crt
      name: $(params.caTrustConfigMapName)
      optional: true
    name: trusted-ca
  - emptyDir: {}
    name: workdir
  - name: ssh
    secret:
      optional: false
      secretName: multi-platform-ssh-$(context.taskRun.name)
